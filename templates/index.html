<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mia · AI伙伴</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f4f5f7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:760px;height:100vh;margin:auto;background:white;display:flex;flex-direction:column}
header{padding:16px 18px;border-bottom:1px solid #eee;font-weight:700}
header small{display:block;font-weight:400;color:#888;margin-top:3px}
#chat{flex:1;overflow:auto;padding:18px}
.msg{display:flex;margin:10px 0}.bubble{max-width:82%;padding:11px 14px;border-radius:16px;white-space:pre-wrap;line-height:1.55}
.user{justify-content:flex-end}.user .bubble{background:#222;color:#fff;border-bottom-right-radius:5px}
.assistant .bubble{background:#f0f1f3;color:#222;border-bottom-left-radius:5px}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #eee}
textarea{flex:1;resize:none;border:1px solid #ddd;border-radius:14px;padding:11px;font:inherit;min-height:46px}
button{border:0;border-radius:14px;padding:0 16px;background:#222;color:#fff;font-size:15px}
button:disabled{opacity:.5}
</style>
</head>
<body>
<div class="app">
<header>Mia 🌙<small>你的 AI 聊天伙伴 · V1</small></header>
<div id="chat"></div>
<div class="composer">
<textarea id="input" placeholder="和 Mia 说点什么……"></textarea>
<button id="send">发送</button>
</div>
</div>
<script>
const chat=document.querySelector('#chat');
const input=document.querySelector('#input');
const send=document.querySelector('#send');
let history=JSON.parse(localStorage.getItem('mia_history')||'[]');

function add(role,text){
  const row=document.createElement('div');
  row.className='msg '+role;
  const b=document.createElement('div');
  b.className='bubble'; b.textContent=text;
  row.appendChild(b); chat.appendChild(row); chat.scrollTop=chat.scrollHeight;
}
history.forEach(x=>add(x.role,x.content));
if(!history.length)add('assistant','嗨，我是 Mia。\\n今天想聊点什么？');

async function go(){
  const message=input.value.trim(); if(!message)return;
  input.value=''; send.disabled=true;
  add('user',message);
  history.push({role:'user',content:message});
  try{
    const r=await fetch('/api/chat',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message,history})
    });
    const data=await r.json();
    if(!r.ok)throw new Error(data.error||'请求失败');
    add('assistant',data.reply);
    history.push({role:'assistant',content:data.reply});
    history=history.slice(-30);
    localStorage.setItem('mia_history',JSON.stringify(history));
  }catch(e){add('assistant','呃……刚才出了一点问题：'+e.message)}
  send.disabled=false; input.focus();
}
send.onclick=go;
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go()}});
</script>
</body>
</html>
